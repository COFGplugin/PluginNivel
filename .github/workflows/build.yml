name: Build VST3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar CMake
      uses: lukka/get-cmake@latest
    - name: Clonar JUCE
      run: git clone https://github.com/juce-framework/JUCE.git --depth 1
    - name: Configurar y Compilar
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64
        cmake --build build --config Release
    - name: Subir VST3
      uses: actions/upload-artifact@v4
      with:
        name: NivelPlugin-VST3
        path: build/NivelPlugin_artefacts/Release/VST3/NivelPlugin.vst3
